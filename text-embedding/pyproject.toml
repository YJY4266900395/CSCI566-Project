[project]
name = "shortvideo-text-embedding"
version = "0.1.0"
description = "Text embedding pipeline for short-video metadata/text."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "huggingface-hub>=0.23",
  "sentence-transformers>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "tqdm>=4.66",
  "pyarrow>=14.0",
  "openai>=1.0.0",
  "hnswlib>=0.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false
